plugins {
    alias libs.plugins.android.library
    // AGP 9.x 内置 Kotlin 支持：自动识别 .kt 文件，不额外 apply kotlin-android
}

android {
    namespace = 'com.lyo.media3.player'

    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    configurations.configureEach {
        exclude group: 'com.android.support'
    }
}

// uni-app 离线基座内置的是旧版 Kotlin 运行时。限制语言/API 版本，避免生成
// kotlin.enums.EnumEntriesKt（Kotlin 1.9+）等基座不存在的符号。
kotlin {
    compilerOptions {
        languageVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_1_8
        apiVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_1_8
    }
}

dependencies {
    // Media3 播放内核 + HLS + UI
    // plugin fatAar 从上层 releaseCompileClasspath 收集外部依赖，因此必须传递暴露。
    api libs.media3.exoplayer
    api libs.media3.exoplayer.hls
    api libs.media3.common

    // uni-app 原生插件 SDK 仅编译期引用（宿主已自带）
    compileOnly fileTree(dir: "libs", include: ["*.aar", "*.jar"])
    compileOnly 'com.alibaba:fastjson:1.2.83'
}
